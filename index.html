<!DOCTYPE html>
<html>
<head>
    <title>Experiment No 14 - Responsive Web Design</title>

    <!-- Viewport Meta Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- External CSS -->
    <style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

header {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 15px;
}

nav {
    background-color: #555;
    display: flex;
    justify-content: center;
}

nav a {
    color: white;
    padding: 10px 15px;
    text-decoration: none;
}

.container {
    display: flex;
    padding: 10px;
}

.box {
    flex: 1;
    margin: 5px;
    padding: 20px;
    background-color: lightgray;
    text-align: center;
}

/* Media Query for Mobile Devices */
@media (max-width: 768px) {
    nav {
        flex-direction: column;
        align-items: center;
    }

    .container {
        flex-direction: column;
    }
}
</style>
</head>
